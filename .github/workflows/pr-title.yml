name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]  # 'edited' re-runs the check when the PR title changes

permissions:
  pull-requests: read   # the action only reads the PR title, no other permissions needed

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # built-in token, nothing to create
